<div id="toggle-theme">
		<input type="checkbox" class="checkbox" id="checkbox">
		<label for="checkbox" class="checkbox-label">
			<i class="fas fa-moon"></i>
			<i class="fas fa-sun"></i>
			<span class="ball"></span>
		</label>
		<script type="text/javascript">
			//identify the toggle switch HTML element
			const toggleSwitch = document.querySelector('#toggle-theme input[type="checkbox"]');

			//function that changes the theme, and sets a localStorage variable to track the theme between page loads
			function switchTheme(e) {
				if (e.target.checked) {
					localStorage.setItem('theme', 'dark');
					document.documentElement.setAttribute('data-theme', 'dark');
					toggleSwitch.checked = true;
				} else {
					localStorage.setItem('theme', 'light');
					document.documentElement.setAttribute('data-theme', 'light');
					toggleSwitch.checked = false;
				}    
			}
			//listener for changing themes
			toggleSwitch.addEventListener('change', switchTheme, false);
			
			const systemSettingIsDarkMode =window.matchMedia("(prefers-color-scheme:dark)").matches
			const localThemeSetting = localStorage.getItem('theme');

			if( localThemeSetting === 'dark' || localThemeSetting === 'light') {
				setThemeTo = localThemeSetting;
			} else if( systemSettingIsDarkMode) {
				setThemeTo = 'dark';
			} else { 
				setThemeTo = 'light';
			}

			localStorage.setItem('theme', setThemeTo);
			document.documentElement.setAttribute('data-theme', setThemeTo );
			toggleSwitch.checked = setThemeTo==='dark'? true:false;

			//pre-check the dark-theme checkbox if dark-theme is set
			if (document.documentElement.getAttribute("data-theme") == "dark"){
				toggleSwitch.checked = true;
			}
		</script>
	</div>
